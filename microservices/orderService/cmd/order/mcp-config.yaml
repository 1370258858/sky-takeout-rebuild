server:
  name: order-tools
  version: v1.0.0
  address: ":8004"
  path: "/mcp"

tools:
  - name: create_order
    description: |
      Create a takeout order. Two modes — pick exactly one:

      Mode 1 (goods list): cartId must be 0 or omitted. Required: goodIds, amount, addressBookId. Do NOT pass cartId.
      Mode 2 (shopping cart): cartId must be non-zero. Required: cartId, addressBookId. Do NOT pass goodIds.

      userId is always optional — omit it or pass 0 and the server will prompt for it via Elicit.
      Optional for both modes: remark, phone, address, userName, consignee, payMethod, estimatedDeliveryTime, packAmount, tablewareNumber, tablewareStatus.
    handler: CreateOrder

  - name: create_cart
    description: "Create cart items. Required: userId, goodIds, quantity. Optional: name, image, flavor, amount."
    handler: CreateCart

  - name: cart_detail
    description: "Get shopping cart details. Required: userId."
    handler: CartDetail

  - name: update_cart
    description: "Update cart item quantity/flavor/amount. Required: userId, cartId, quantity."
    handler: UpdateCart

  - name: delete_cart
    description: "Delete cart items. Required: userId, cartId (or omit cartId to delete all)."
    handler: DeleteCart

  - name: refund_order
    description: "Refund a paid order. Required: order ID. Optional: reason."
    handler: RefundOrder

  - name: get_order_detail
    description: "Get order details by order ID."
    handler: GetOrderDetail

  - name: cancel_order
    description: "Cancel an order. Required: order ID. Optional: reason."
    handler: CancelOrder

  - name: pay_order
    description: "Process order payment. Required: order ID, payStatus (1=success, 2=failed, 3=timeout)."
    handler: PayOrder

  - name: list_orders
    description: "List orders by user. Required: userId. Optional: status filter."
    handler: ListOrders

